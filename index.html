<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- NAVBAR -->
  <header>
    <nav class="navbar">
      <h1 class="logo">MyPortfolio</h1>
      <ul class="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h2>Hello, I'm John</h2>
    <p>I build cool things with code.</p>
    <button onclick="scrollToSection('projects')">View Projects</button>
  </section>

  <!-- ABOUT -->
  <section id="about" class="section">
    <h2>About Me</h2>
    <p>
      Brief intro about yourself, your skills, and what you're working on.
    </p>
  </section>

  <!-- PROJECTS -->
  <section id="projects" class="section">
    <h2>Projects</h2>
    <div class="projects-container">
      <div class="project-card">
        <h3>Project 1</h3>
        <p>Short description</p>
        <a href="#">View</a>
      </div>
      <div class="project-card">
        <h3>Project 2</h3>
        <p>Short description</p>
        <a href="#">View</a>
      </div>
    </div>
  </section>

  <!-- CONTACT -->
  <section id="contact" class="section">
    <h2>Contact</h2>
    <form id="contact-form">
      <input type="text" placeholder="Your Name" required />
      <input type="email" placeholder="Your Email" required />
      <textarea placeholder="Your Message" required></textarea>
      <button type="submit">Send</button>
    </form>
  </section>

  <footer>
    <p>© 2026 John Smith</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
